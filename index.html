<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>術後復健追蹤系統Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#1d2726; --muted:#56625f; --line:#dcdfdb; --line2:#eceeec; --field:#b9c2bf;
  --teal:#1e6f68; --teal-ink:#165a54; --teal-soft:#e3efec; --teal-bar:#8fbdb5;
  --alert:#b0481a; --alert-ink:#8a3510; --alert-soft:#fbeee6; --alert-line:#efc9b3;
  --nav:#123532; --nav-ink:#f3efe6; --nav-active:#1e4f4a; --nav-muted:#c9d6d3;
  --admin:#2b2f45; --admin-active:#43486a;
  --frame:#d5dad8; --video:#dfe7e4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141a19; --surface:#1d2524; --ink:#e8ecea; --muted:#a3b0ac; --line:#33403d; --line2:#2a3533; --field:#4a5855;
    --teal:#2f8f86; --teal-ink:#8fd3c8; --teal-soft:#1f3a37; --teal-bar:#3f7e76;
    --alert:#d9692f; --alert-ink:#f0a87f; --alert-soft:#3a251b; --alert-line:#6b3a22;
    --nav:#0d1f1d; --nav-ink:#e8ecea; --nav-active:#1f3a37; --nav-muted:#9fb3ae;
    --admin:#1b1e2e; --admin-active:#34385a;
    --frame:#2a3533; --video:#26302e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.5}
a{color:var(--teal)}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.demo h1{margin:0;font-size:17px;font-weight:700}
.demo small{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;border:0;background:transparent;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:500}
.ghost{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:14px;cursor:pointer}
.s-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:14px 32px;background:var(--nav);color:var(--nav-ink)}
.s-head.admin{background:var(--admin)}
.s-head .brand{font-size:18px;font-weight:700}
.s-nav{display:flex;flex-wrap:wrap;gap:6px}
.s-nav button{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--nav-ink);font-size:15px;cursor:pointer}
.s-nav button[aria-current="page"]{background:var(--nav-active)}
.s-head.admin .s-nav button[aria-current="page"]{background:var(--admin-active)}
.s-head .who{font-size:14px;color:var(--nav-muted)}
.s-logout{min-height:36px;padding:0 12px;border:1px solid var(--nav-muted);border-radius:8px;background:transparent;color:var(--nav-ink);font-size:14px;cursor:pointer}
[hidden]{display:none!important}
[aria-invalid="true"]{border-color:var(--alert)!important;outline:1px solid var(--alert)}
.s-main{max-width:1200px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
h2.page{margin:0;font-size:28px}
.sub{font-size:15px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:10px;border:0;background:var(--teal);color:#fff;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none}
.btn.line{background:var(--surface);border:1px solid var(--teal);color:var(--teal)}
.btn.plain{background:var(--surface);border:1px solid var(--field);color:var(--ink);font-weight:400}
.btn.warn{background:var(--alert)}
.btn.warn-line{background:var(--surface);border:1px solid var(--alert);color:var(--alert-ink)}
.link{border:0;background:none;padding:0;color:var(--teal);font-size:15px;cursor:pointer;text-align:left;min-height:32px}
.alerts{background:var(--alert-soft);border:1px solid var(--alert-line);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.alerts h3{margin:0;font-size:18px;color:var(--alert-ink)}
.alert-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;background:var(--surface);border-radius:10px;padding:12px 16px}
.alert-row .who{font-weight:700;min-width:72px}
.alert-row .what{flex:1 1 260px}
.alert-row .when{font-size:14px;color:var(--muted)}
.alert-row button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--alert);background:transparent;color:var(--alert-ink);font-size:15px;font-weight:500;cursor:pointer}
.ok{background:var(--teal-soft);border:1px solid var(--teal-bar);border-radius:12px;padding:14px 20px;color:var(--teal-ink);font-weight:500}
.confirm{background:var(--alert-soft);border:1px solid var(--alert-line);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.confirm span{color:var(--alert-ink);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;padding:0 12px;border:1px solid var(--field);border-radius:8px;font-size:15px;background:var(--surface)}
.field textarea{padding:12px;line-height:1.6;resize:vertical}
.err{color:var(--alert-ink);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:14px;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.pill.bad{background:var(--alert-soft);color:var(--alert-ink)}
.pill.good{background:var(--teal-soft);color:var(--teal-ink)}
.pill.off{background:var(--line2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.flex2{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 16px;border:1px solid var(--line);border-radius:10px}
.act > label:first-child{flex:1 1 200px;display:flex;align-items:center;gap:10px;font-size:16px;min-height:44px}
.act input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.act .num{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.act .num input{width:64px;min-height:40px;padding:0 8px;border:1px solid var(--field);border-radius:8px;font-size:15px;background:var(--surface)}
.big{font-size:56px;font-weight:700;color:var(--teal);line-height:1.1}
.bar{height:12px;border-radius:999px;background:var(--teal-soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.chart i{display:block;width:100%;background:var(--teal-bar);border-radius:4px 4px 0 0}
.chart .hot{color:var(--alert-ink);font-weight:700}
.chart .hot i{background:var(--alert)}
.days{display:flex;gap:10px;font-size:13px;color:var(--muted)}
.days span{flex:1;text-align:center}
.plan{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:15px}
.plan:last-child{border-bottom:0}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 36px;display:flex;flex-direction:column;gap:22px}
.report h3{margin:0;font-size:22px}
.report h4{margin:0 0 8px;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kv div{background:var(--bg);border-radius:10px;padding:12px 14px}
.kv b{display:block;font-size:22px}
.kv span{font-size:14px;color:var(--muted)}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.device{position:relative;width:406px;max-width:100%}
.phone{position:relative;width:100%;height:860px;border:8px solid #000;border-radius:54px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px #c4c4c8,0 0 0 3px #e6e6e8,0 18px 40px rgba(0,0,0,.18)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
.island::after{content:"";position:absolute;right:13px;top:11px;width:12px;height:12px;border-radius:50%;background:#1b1f3a;box-shadow:inset 0 0 0 3px #0d0f1e}
.side{position:absolute;width:4px;background:#c4c4c8;border-radius:2px}
.side.l{left:-5px}.side.r{right:-5px}
.p-body{flex:1;overflow-y:auto;padding:58px 20px 22px;display:flex;flex-direction:column;gap:14px;font-size:16px}
.p-body h2{margin:0;font-size:24px}
.p-back{border:0;background:none;padding:0;color:var(--teal);font-size:16px;font-weight:500;min-height:44px;text-align:left;cursor:pointer}
.p-btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-size:18px;font-weight:700;cursor:pointer;width:100%}
.p-btn.sec{background:var(--surface);border:1px solid var(--teal);color:var(--teal)}
.p-field{display:flex;flex-direction:column;gap:8px}
.p-field label,.p-legend{font-size:16px;font-weight:500}
.p-field input,.p-field select,.p-field textarea{min-height:48px;padding:0 12px;border:1px solid var(--field);border-radius:12px;font-size:16px;background:var(--surface);width:100%}
.p-field textarea{padding:14px;line-height:1.6;resize:none}
.p-task{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;font-size:inherit}
.p-task.next{border:2px solid var(--teal)}
.p-task b{display:block;font-size:17px}
.p-task span.d{font-size:14px;color:var(--muted)}
.p-note{display:flex;align-items:center;gap:12px;background:var(--teal-soft);color:var(--teal-ink);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:500}
.p-note.warn{background:var(--alert-soft);color:var(--alert-ink)}
.p-warn{background:var(--alert-soft);border-radius:14px;padding:14px 16px}
.p-warn h3{margin:0 0 4px;font-size:16px;color:var(--alert-ink)}
.p-warn p{margin:0;font-size:15px;line-height:1.6}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.p-card h3{margin:0;font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:14px;color:var(--muted)}
.week i{display:flex;align-items:center;justify-content:center;height:36px;border-radius:10px;font-style:normal;font-size:15px;font-weight:700}
.week i.y{background:var(--teal);color:#fff}
.week i.n{background:var(--line2);color:var(--muted)}
.week i.part{background:var(--teal-soft);color:var(--teal-ink);font-size:13px}
.pains{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pains button{min-height:46px;border-radius:12px;border:1px solid var(--field);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer}
.pains button[aria-pressed="true"]{background:var(--teal);border:2px solid var(--teal);color:#fff}
.p-tab{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:14px}
.p-tab button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;position:relative}
.p-tab button[aria-current="page"]{color:var(--teal);font-weight:700}
.badge{position:absolute;top:10px;right:calc(50% - 22px);min-width:20px;height:20px;border-radius:999px;background:var(--alert);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.msg.mine{align-self:flex-end;max-width:88%;background:var(--teal-soft);border-color:transparent}
.msg p{margin:0;line-height:1.7}
.spacer{flex:1}
.center{text-align:center}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
@media print{.demo,.s-head,.no-print{display:none!important}body{background:#fff;color:#000}.s-main{padding:0;max-width:none}.report{border:0;padding:0}}
</style>
</head>
<body>
<header class="demo">
  <h1>術後復健追蹤系統Demo</h1>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
    <div class="seg" role="group" aria-label="切換使用者">
      <button type="button" data-side="staff">醫療人員後台</button>
      <button type="button" data-side="patient">病患端手機</button>
      <button type="button" data-side="admin">系統管理者</button>
    </div>
    <button type="button" class="ghost" data-act="reset">重設展示</button>
  </div>
</header>
<div id="app"></div>
<script>
const DEMO_PWD = 'demo1234';
const PATIENT_ACCTS = ['A123456789','0912345678'];
const FEEDBACK = '直膝抬腿時疼痛升高，課表已將每組次數調降為 8 下。若疼痛持續，請在系統中回覆告訴我。';
const REPLY = '好的，我明天照新的次數做，再回報疼痛狀況。';
const DAYS = ['10/16','10/17','10/18','10/19','10/20','10/21','10/22'];
const WEEKDAY = ['五','六','日','一','二','三','四'];
const TODAY = '10/22', TODAY_ISO = '2026-10-22';
const PAIN_ALERT = 7;   // 疼痛分數 ≥ 7 分標示異常
const MAX_FAILS = 5;    // 連續登入失敗 5 次鎖定帳號
// 10/16–10/20 為已結束的歷史資料（皆已完成當日課表）；10/21 起依實際紀錄計算
const BASE_PAIN = [2,3,2,3,4];
const BASE_MIN = [15,12,15,10,15];
const HISTORY = [['10/20','膝關節彎曲運動',30,15,4],['10/19','股四頭肌等長收縮',30,10,3]];
const PREV_PAIN = 4;
const INIT_PLAN = [{name:'股四頭肌等長收縮',sets:3,reps:10},{name:'直膝抬腿',sets:3,reps:10},{name:'膝關節彎曲運動',sets:2,reps:15}];
const INIT_SCHED = {start:'2026-10-16', end:'2026-11-20', freq:'每天', time:'09:00'};
const NEW_SCHED = {start:TODAY_ISO, end:'2026-11-19', freq:'每天', time:'09:00'};
const PATIENTS = ['王小明（A1023）膝關節置換術','李美華（A1047）髖關節置換術','張志豪（A1102）前十字韌帶重建'];
const PLAYLIST_ID = 'PLy50NfNABdXOisExo2m6TtjsjMsQk4qPc';
const PLAYLIST_URL = 'https://www.youtube.com/playlist?list=' + PLAYLIST_ID;
const GUIDES = {
  '股四頭肌等長收縮':{steps:['平躺，雙腿伸直。','大腿前側出力，把膝蓋往床面壓，感覺大腿肌肉繃緊。','停留 5 秒後放鬆。'], note:'出力時保持正常呼吸，不要憋氣。'},
  '直膝抬腿':{steps:['平躺，未手術側膝蓋彎曲、腳掌踩床。','手術側膝蓋伸直，大腿出力將腳抬高約 30 公分。','停留 5 秒後，慢慢放下。'], note:'若疼痛明顯加劇，請停止動作，並在紀錄中填寫疼痛分數。'},
  '膝關節彎曲運動':{steps:['坐姿或平躺，雙腿伸直。','腳跟沿著床面慢慢往臀部方向滑，彎曲膝蓋。','彎到可接受的角度停留 5 秒，再慢慢伸直。'], note:'以不引起劇痛為原則，慢慢增加彎曲角度。'}
};
const LIB = [
  {name:'股四頭肌等長收縮', part:'膝關節', steps:'平躺，膝蓋伸直，大腿前側出力把膝蓋往床面壓，停留 5 秒後放鬆。', note:'出力時保持呼吸，不要憋氣。', video:true},
  {name:'直膝抬腿', part:'膝關節', steps:'平躺，手術側膝蓋伸直，將腳抬高約 30 公分，停留 5 秒後慢慢放下。', note:'若疼痛明顯加劇，請停止動作。', video:true},
  {name:'膝關節彎曲運動', part:'膝關節', steps:'坐姿或平躺，腳跟沿床面慢慢往臀部滑，彎到可接受角度後伸直。', note:'以不引起劇痛為原則，慢慢增加角度。', video:true},
  {name:'踝關節幫浦運動', part:'踝關節', steps:'平躺，腳踝反覆向上勾、向下壓。', note:'可促進下肢血液循環。', video:false},
  {name:'鐘擺運動', part:'肩關節', steps:'身體前傾，手臂自然下垂，以畫小圈方式輕輕擺動。', note:'讓手臂放鬆，由身體帶動擺動。', video:false}
];
const USERS = [
  {name:'林雅婷', title:'物理治療師', acct:'pt.lin', role:'醫療人員', active:true, pwd:DEMO_PWD},
  {name:'陳建宏', title:'醫師', acct:'dr.chen', role:'醫療人員', active:true, pwd:DEMO_PWD},
  {name:'吳佩珊', title:'物理治療師', acct:'pt.wu', role:'醫療人員', active:false, pwd:DEMO_PWD},
  {name:'黃志明', title:'資訊室', acct:'admin01', role:'系統管理者', active:true, pwd:DEMO_PWD}
];
const init = () => ({
  side:'staff', s:'list', p:'login', a:'users',
  staffUser:null, adminUser:null, loginErr:{}, loginAcct:{staff:'pt.lin', admin:'admin01', patient:PATIENT_ACCTS[0]}, fails:{},
  plan:INIT_PLAN.map(x=>Object.assign({},x)), sched:Object.assign({},INIT_SCHED),
  fbText:FEEDBACK, replyText:REPLY, fbFrom:'',
  saved:false, schedMode:'new', schedEdited:false, schedOff:false, listMsg:'', videoOn:false, guide:1, recAct:'直膝抬腿', confirmOff:false, schedMsg:'',
  recs:[], nextId:1, alerts:[], recView:'form', editId:null, lastId:null, pain:null, recUpdated:false,
  fbSent:false, replySent:false, reportMsg:'',
  lib:LIB.map(x=>Object.assign({},x)), libForm:null, libMsg:'', libDel:null,
  users:USERS.map(x=>Object.assign({},x)), userForm:null, userMsg:''
});
let st = init();
const set = (patch) => { st = Object.assign({}, st, patch); render(); };
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const recsOn = (date) => st.recs.filter(r => r.date === date);
// 一天的狀態：課表中每個動作都有紀錄才算完成（y），做了一部分為 part
const dayInfo = (i) => {
  if (i < BASE_MIN.length) return {status:'y', mins:BASE_MIN[i], pain:BASE_PAIN[i]};
  const rs = recsOn(DAYS[i]);
  const n = st.plan.filter(p => rs.some(r => r.act === p.name)).length;
  return {status: n && n === st.plan.length ? 'y' : n ? 'part' : 'n', n,

};

function checkLogin(side){
  const acct = val(side+'-ac'), pwd = document.getElementById(side+'-pw').value;
  const key = failKey(side, acct);
  const fail = (msg, fails) => set({fails: fails || st.fails, loginErr:Object.assign({}, st.loginErr, {[side]:msg}), loginAcct:Object.assign({}, st.loginAcct, {[side]:acct})});
  const lockMsg = `連續登入失敗 ${MAX_FAILS} 次，帳號已鎖定。請 15 分鐘後再試，或${side==='patient'?'聯絡負責的醫療人員':'聯絡系統管理者'}解除鎖定。`;
  if (!acct || !pwd) return fail('請輸入帳號與密碼');
  if (isLocked(key)) return fail(lockMsg);
  const u = side === 'patient' ? null : st.users.find(x => x.acct === acct);
  const okPwd = side === 'patient' ? PATIENT_ACCTS.includes(acct.toUpperCase()) && pwd === DEMO_PWD : !!u && u.pwd === pwd;
  if (!okPwd) {
    const n = (st.fails[key] || 0) + 1;
    const fails = Object.assign({}, st.fails, {[key]:n});
    return fail(n >= MAX_FAILS ? lockMsg : `帳號或密碼錯誤，還可以再試 ${MAX_FAILS - n} 次`, fails);
  }
  const fails = Object.assign({}, st.fails); delete fails[key];
  const ok = {fails, loginErr:Object.assign({}, st.loginErr, {[side]:''}), loginAcct:Object.assign({}, st.loginAcct, {[side]:acct})};
  if (side === 'patient') return set(Object.assign(ok, {p:'home'}));
  const role = side === 'staff' ? '醫療人員' : '系統管理者';
  if (!u.active) return fail('此帳號已停用，請聯絡系統管理者', fails);
  if (u.role !== role) return fail(`此帳號沒有${role}權限`, fails);
  return set(Object.assign(ok, {[side==='staff'?'staffUser':'adminUser']:u}));
}

  const next = done.indexOf(false);
  const t = (i)=>`<button type="button" class="p-task ${i===next?'next':''}" data-guide="${i}"><span><b>${esc(plan[i].name)}</b><span class="d">${planText(i)}</span></span><span class="pill ${done[i]?'good':'bad'}">${done[i]?'已完成':'待完成'}</span></button>`;

  if (st.side==='staff' && !st.staffUser) {
    app.innerHTML = loginCard('staff', '醫療人員登入', '員工帳號', '帳號 pt.lin');
  } else if (st.side==='staff') {
    app.innerHTML = ({list:staffList, schedule:staffSchedule, patient:staffPatient, library:staffLibrary, report:staffReport})[st.s]();
  } else if (st.side==='admin' && !st.adminUser) {
    app.innerHTML = loginCard('admin', '系統管理者登入', '管理者帳號', '帳號 admin01');
  } else if (st.side==='admin') {
    app.innerHTML = adminUsers();
  } else {
    const screen = ({login:pLogin, home:pHome, guide:pGuide, record:pRecord, progress:pProgress, feedback:pFeedback})[st.p]();
    app.innerHTML = `<div class="stage"><div class="device"><span class="side l" style="top:150px;height:32px" aria-hidden="true"></span><span class="side l" style="top:215px;height:62px" aria-hidden="true"></span><span class="side l" style="top:290px;height:62px" aria-hidden="true"></span><span class="side r" style="top:240px;height:96px" aria-hidden="true"></span><div class="phone" aria-label="病患端手機畫面"><span class="island" aria-hidden="true"></span>${screen}</div></div></div>`;
  }
  window.scrollTo(0,0);
}
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
document.addEventListener('click', (e)=>{
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.side) return set({side:d.side});
  if (d.s) return set({s:d.s, libForm:null, libDel:null, libMsg:'', schedMsg:'', reportMsg:'', confirmOff:false, listMsg:''});
  if (d.guide !== undefined) return set({p:'guide', guide:Number(d.guide), videoOn:false});
  if (d.rec) return set({p:'record', recAct:d.rec, recView:'form', editId:null, pain:null});
  if (d.unlock) { const fails = Object.assign({}, st.fails); delete fails['u:'+d.unlock]; return set({fails, userMsg:`已解除「${d.unlock}」的登入鎖定`}); }
  if (d.sched) return set({s:'schedule', schedMode:d.sched, schedMsg:''});
  if (d.p) return set({p:d.p, videoOn:false});
  if (d.pain !== undefined) {
    st.pain = Number(d.pain);
    document.querySelectorAll('[data-pain]').forEach(x=>x.setAttribute('aria-pressed', String(Number(x.dataset.pain)===st.pain)));
    const lg = document.getElementById('painLegend'); if (lg) lg.textContent = '疼痛程度：' + st.pain + ' 分';
    const h = document.getElementById('painHint'); if (h) h.hidden = true;
    return;
  }
  if (d.edit !== undefined) return set({libForm:{idx:Number(d.edit)}, libMsg:'', libDel:null});
  if (d.del !== undefined) return set({libDel:Number(d.del), libForm:null, libMsg:''});
  if (d.uedit !== undefined) return set({userForm:{idx:Number(d.uedit)}, userMsg:''});
  switch (d.act) {
    case 'reset': st = init(); return render();
    case 'playVideo': return set({videoOn:true});
    case 'demoOnly': return set({listMsg:'此雛型僅示範「王小明」的病患紀錄，其他病患為範例資料。'});
    case 'login': return checkLogin(d.sideLogin);
    case 'logout': return set(d.sideLogin==='staff' ? {staffUser:null, s:'list'} : {adminUser:null, userForm:null, userMsg:''});
    case 'saveSched': {
      const errs = [], bad = [];
      const sched = {start:val('d1'), end:val('d2'), freq:val('fq'), time:val('tm')};
      if (!sched.start) { errs.push('請選擇開始日期'); bad.push('d1'); }
      if (!sched.end) { errs.push('請選擇結束日期'); bad.push('d2'); }
      if (sched.start && sched.start < TODAY_ISO && !(st.schedMode==='edit' && sched.start===st.sched.start)) { errs.push(`開始日期不可早於今天（${TODAY}）`); bad.push('d1'); }
      if (sched.start && sched.end && sched.end < sched.start) { errs.push('結束日期不可早於開始日期'); bad.push('d2'); }
      if (!sched.time) { errs.push('請設定預定執行時間'); bad.push('tm'); }
      const plan = [];
      st.lib.forEach((x,i)=>{
        if (!document.getElementById('sa-'+i).checked) return;
        const sets = Number(val('ss-'+i)), reps = Number(val('sr-'+i));
        const okS = Number.isInteger(sets) && sets >= 1 && val('ss-'+i) !== '';
        const okR = Number.isInteger(reps) && reps >= 1 && val('sr-'+i) !== '';
        if (!okS) bad.push('ss-'+i);
        if (!okR) bad.push('sr-'+i);
        if (!okS || !okR) errs.push(`「${x.name}」的組數與每組次數需為 1 以上的整數`);
        plan.push({name:x.name, sets, reps});
      });
      if (!plan.length) errs.push('請至少勾選一個復健動作');
      document.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
      if (errs.length) {
        bad.forEach(id=>document.getElementById(id).setAttribute('aria-invalid','true'));
        const box = document.getElementById('sched-err');
        box.innerHTML = `<h3>資料不完整，請修正後再儲存</h3><ul style="margin:0;padding-left:22px">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
        box.hidden = false; box.scrollIntoView({block:'center'});
        return;
      }
      const edit = st.schedMode==='edit';
      const ptIdx = edit ? 0 : document.getElementById('pt').selectedIndex;
      if (ptIdx !== 0) return set({schedMsg:`已為 ${PATIENTS[ptIdx].split('（')[0]} 儲存課表（狀態：執行中），系統已通知病患。`});
      return set({plan, sched, saved:true, schedOff:false, schedEdited: st.schedEdited || edit, guide:0, schedMsg: edit ? '課表已更新，系統已通知病患課表異動。' : '課表已儲存（狀態：執行中），系統已通知病患。'});
    }
    case 'offAsk': return set({confirmOff:true});
    case 'offCancel': return set({confirmOff:false});
    case 'offYes': return set({schedOff:true, confirmOff:false});
    case 'handle': return set({alerts: st.alerts.map(a=>Object.assign({}, a, {handled:true}))});
    case 'feedback': {
      const text = val('fb');
      if (!text) { document.getElementById('fb-err').hidden=false; document.getElementById('fb').focus(); return; }
      return set({fbSent:true, fbText:text, fbFrom:staffName()});
    }
    case 'reply': {
      const text = val('rp');
      if (!text) { document.getElementById('rp-err').hidden=false; document.getElementById('rp').focus(); return; }
      return set({replySent:true, replyText:text});
    }
    case 'print': return window.print();
    case 'pdf': return set({reportMsg:'已產生 PDF 報告（雛型展示，未實際下載檔案）。'});
    case 'editRec': { const r = st.recs.find(x=>x.id===st.lastId); return set({recView:'form', editId:st.lastId, pain:r.pain}); }
    case 'submit': {
      const rec = {date:val('dt'), act:val('ax'), count:Number(val('cn')), mins:Number(val('mn')), pain:st.pain};
      const pos = (v) => Number.isInteger(v) && v >= 1;
      const dup = st.recs.find(r => r.date===rec.date && r.act===rec.act);
      const err = !pos(rec.count) || !val('cn') ? '完成次數需為 1 以上的整數'
        : !pos(rec.mins) || !val('mn') ? '時間需為 1 分鐘以上的整數'
        : rec.pain===null ? '請先選擇疼痛程度'
        : st.editId!==null && dup && dup.id!==st.editId ? '這一天已經有這個動作的紀錄，請改修改那筆紀錄' : '';
      if (err) { const h = document.getElementById('painHint'); h.textContent = err; h.hidden = false; return; }
      // 修改既有紀錄（含同一天同動作重複填寫）沿用原本的 id，異常通知只依 id 發送一次
      const id = st.editId!==null ? st.editId : dup ? dup.id : st.nextId;
      const isNew = id === st.nextId;
      const recs = isNew ? st.recs.concat(Object.assign({id}, rec)) : st.recs.map(r => r.id===id ? Object.assign({id}, rec) : r);
      let alerts = st.alerts;
      if (rec.pain >= PAIN_ALERT && !alerts.some(a => a.recId===id)) {
        const k = recs.findIndex(r => r.id===id);
        const prev = k > 0 ? recs[k-1].pain : PREV_PAIN;
        alerts = alerts.concat({recId:id, date:rec.date, act:rec.act, pain:rec.pain, rise:rec.pain-prev, handled:false});
      }
      return set({recs, alerts, nextId: isNew ? st.nextId+1 : st.nextId, lastId:id, recView:'done', editId:null, recUpdated:!isNew});
    }
    case 'libNew': return set({libForm:{idx:-1}, libMsg:'', libDel:null});
    case 'delCancel': return set({libDel:null});
    case 'delYes': {
      const name = st.lib[st.libDel].name;
      return set({lib: st.lib.filter((_,i)=>i!==st.libDel), libDel:null, libMsg:`已從復健動作庫刪除「${name}」`});
    }
    case 'libCancel': return set({libForm:null});
    case 'libSave': {
      const name = val('lf-name');
      if (!name) { document.getElementById('lf-err').hidden=false; document.getElementById('lf-name').focus(); return; }
      const idx = st.libForm.idx;
      const file = document.getElementById('lf-video').files.length > 0;
      const item = {name, part:val('lf-part'), steps:val('lf-steps'), note:val('lf-note'), video: file || (idx>=0 && st.lib[idx].video)};
      const lib = st.lib.slice();
      if (idx>=0) lib[idx]=item; else lib.push(item);
      return set({lib, libForm:null, libMsg: idx>=0 ? `已儲存「${name}」的變更` : `已新增「${name}」到復健動作庫`});
    }
    case 'userNew': return set({userForm:{idx:-1}, userMsg:''});
    case 'userCancel': return set({userForm:null});
    case 'userSave': {
      const name = val('u-name'), acct = val('u-acct');
      const idx = st.userForm.idx;
      const pwd = idx>=0 ? st.users[idx].pwd : document.getElementById('u-pwd').value;
      const uErr = !name || !acct ? '請輸入姓名與帳號'
        : idx<0 && st.users.some(u=>u.acct===acct) ? '此帳號已存在，請換一個帳號'
        : idx<0 && pwd.length < 8 ? '初始密碼至少需 8 碼' : '';
      if (uErr) { const el = document.getElementById('u-err'); el.textContent = uErr; el.hidden = false; return; }
      const users = st.users.slice();
      const item = {name, acct, pwd, title:val('u-title'), role:val('u-role'), active: idx>=0 ? val('u-active')==='1' : true};
      if (idx>=0) users[idx]=item; else users.push(item);
      const stillOk = (u, role) => u && u.acct===acct ? (item.active && item.role===role ? item : null) : u;
      return set({users, userForm:null, staffUser:stillOk(st.staffUser,'醫療人員'), adminUser:stillOk(st.adminUser,'系統管理者'), userMsg: idx>=0 ? `已更新「${name}」的帳號與權限` : `已建立「${name}」的醫療人員帳號`});
    }
  }
});
document.addEventListener('keydown', (e)=>{
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const box = e.target.closest('[data-login]');
  if (box) { e.preventDefault(); box.querySelector('[data-act="login"]').click(); }
});
document.addEventListener('input', (e)=>{
  // 保留輸入中的文字，避免其他操作重繪畫面時被洗掉
  if (e.target.id === 'fb') { st.fbText = e.target.value; document.getElementById('fb-err').hidden = true; return; }
  if (e.target.id === 'rp') { st.replyText = e.target.value; document.getElementById('rp-err').hidden = true; return; }
  if (e.target.id !== 'q') return;
  const q = e.target.value.trim();
  let shown = 0;
  document.querySelectorAll('tr[data-q]').forEach(tr=>{ const ok = !q || tr.dataset.q.includes(q); tr.hidden = !ok; if (ok) shown++; });
  const nm = document.getElementById('noMatch'); if (nm) nm.hidden = shown > 0;
});
render();
</script>
</body>
</html>
